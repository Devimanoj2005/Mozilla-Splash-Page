<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mozilla Splash Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>Mozilla</h1>
        <p>Building a healthier internet for everyone.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>About Mozilla</h2>
            <img src="images/firefox-logo.png" alt="Mozilla Firefox Logo" class="logo">
            <p>
                Mozilla is a global nonprofit organization committed to keeping the web open,
                secure, and accessible for all.
            </p>
        </section>

        <section class="card">
            <h2>Explore Mozilla 🎥</h2>
            <video controls>
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </section>

    </main>

    <footer>
        <p>© 2025 | Designed by Devutty</p>
    </footer>

</body>
</html>
